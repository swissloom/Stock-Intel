name: Quant Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (hard gate)
        env:
          # Disable real latency sleeps so the suite runs fast.
          SIMULATE_LATENCY: "0"
        run: pytest tests/ -v

      - name: Run pipeline (live data; may hit Yahoo rate limits)
        # Non-blocking: live Yahoo Finance downloads intermittently return
        # HTTP 429, which must not fail the overall workflow.
        continue-on-error: true
        env:
          SIMULATE_LATENCY: "0"
        run: python main.py

  deploy-dashboard:
    runs-on: ubuntu-latest
    needs: pipeline
    # Deploy only on a push to main; never on pull_request or other branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dashboard
        env:
          SIMULATE_LATENCY: "0"
        run: python main.py

      - name: Verify dashboard artifact exists and is non-empty
        # Live Yahoo Finance downloads can intermittently fail with HTTP 429.
        # Guard against publishing a missing/empty artifact.
        run: |
          if ! test -s output/index.html; then
            echo "::error::output/index.html is missing or empty; refusing to deploy."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output --project-name=stock-intel
